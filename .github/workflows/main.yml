name: Build and Deploy
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    uses: nais/actions/.github/workflows/mise-build-deploy-fasit.yaml@602637a7900ef2b09cc73ac3b845307ca1ea9f52
    with:
      builds-chart: true
      builds-docker: true
      deploys-to-fasit: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      mise-tasks: '["lint", "fmt-check"]'
      targets: |
        [
          { "target": { "kind": "management", "tenant": "ci-nais" }, "wait": true },
          { "target": { "kind": "management" } }
        ]
    secrets:
      NAIS_IO_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
